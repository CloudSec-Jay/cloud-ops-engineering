framework:
  - cloudformation
  - terraform
  - ansible
  - dockerfile
  - yaml
quiet: false
compact: false
skip-check:
  - CKV2_AWS_62   # S3 event notifications managed at org level, not per-bucket
  - CKV_AWS_144   # Cross-region replication optional for state/log buckets — single-region lab
  - CKV_AWS_273   # wazuh-s3-reader is a service account — SSO not applicable for programmatic access
  - CKV_AWS_40    # wazuh-s3-reader inline policy is intentional — scoped read-only service account
  - CKV_AWS_252   # CloudTrail SNS topic optional — alerts handled via GuardDuty + Wazuh
  - CKV2_AWS_10   # CloudTrail CW integration is optional var — enabled in production deployment
  - CKV2_AWS_3    # GuardDuty org delegation managed at org level, not per-detector
  - CKV_AWS_300   # S3 lifecycle abort rule not required for log-only buckets
  - CKV2_AWS_61   # Lifecycle on tf_state bucket not required — versioning handles retention
  - CKV_AWS_119   # DynamoDB CMK encryption optional for tf_locks and contact table — AWS-managed key sufficient
  - CKV_AWS_158   # CloudWatch Log Group KMS encryption optional for lab/portfolio workloads
  - CKV_AWS_18    # S3 access logging optional — CloudTrail covers API-level access
  - CKV_AWS_116   # Lambda DLQ optional for contact form — low-volume, synchronous invocation
  - CKV_AWS_173   # Lambda env var encryption optional — no secrets in env vars, values from SSM
  - CKV_AWS_115   # Lambda concurrency limit optional for contact form — rate limited by WAF
  - CKV_AWS_117   # Lambda VPC optional for contact form — public API, no VPC resources accessed
  - CKV_AWS_192   # WAF Log4j rule not applicable — contact form Lambda uses Python, not Java
  - CKV_AWS_95    # API Gateway access logging optional for lab — CloudTrail covers management events
  - CKV_SECRET_6  # False positive — os.environ.get() calls with redacted variable names, not actual secrets
