---
# Ansible Galaxy collection dependencies
# Install with: ansible-galaxy collection install -r collections/requirements.yml

collections:
  # Required by ansible-lockdown/RHEL9-CIS and system_cleanup.yml
  - name: community.general
    version: ">=8.0.0"

  # Required by system_cleanup.yml (docker_prune)
  - name: community.docker
    version: ">=3.0.0"

  # Required by ansible-lockdown/RHEL9-CIS
  - name: ansible.posix
    version: ">=1.5.0"

  - name: community.crypto
    version: ">=2.0.0"
