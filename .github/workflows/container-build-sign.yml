name: Build, Push, and Sign Containers

# Runs on push to main when container source changes
on:
  push:
    branches: ["main"]
    paths:
      - "containers/images/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write      # Push to ghcr.io
  id-token: write      # Keyless cosign signing via GitHub OIDC

jobs:
  detect-changes:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      any-changed: ${{ steps.build-matrix.outputs.any-changed }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Build matrix of changed images
        id: build-matrix
        run: |
          IMAGES_DIR="containers/images"
          CANDIDATES=(
            "lint-container"
            "toolbox"
          )

          MATRIX='{"include":['
          FIRST=true
          for name in "${CANDIDATES[@]}"; do
            CHANGED=false
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              CHANGED=true
            elif git diff --name-only HEAD~1 HEAD -- "${IMAGES_DIR}/${name}" | grep -q .; then
              CHANGED=true
            fi
            if [[ "$CHANGED" == "true" ]]; then
              if [ "$FIRST" = false ]; then MATRIX+=','; fi
              MATRIX+="{\"name\":\"${name}\",\"context\":\"${IMAGES_DIR}/${name}\"}"
              FIRST=false
            fi
          done
          MATRIX+=']}'

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$FIRST" = true ]; then
            echo "any-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "any-changed=true" >> "$GITHUB_OUTPUT"
          fi

  build-sign:
    name: Build and Sign ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any-changed == 'true'

    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase owner for ghcr.io
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to ghcr.io
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.name }}:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      # Keyless signing — identity bound to this workflow via GitHub OIDC
      # Signature recorded in Sigstore transparency log
      - name: Sign ${{ matrix.name }}
        run: |
          cosign sign --yes \
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}

      # SBOM generation and attestation — SLSA provenance
      - name: Generate SBOM
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0
        with:
          image: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.name }}.spdx.json \
            --type spdxjson \
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
